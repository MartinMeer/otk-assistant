# Production Docker Compose Configuration
# 
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Features:
# - Resource limits and reservations
# - Security hardening (secrets, non-root users)
# - Health checks and auto-restart
# - Nginx reverse proxy with SSL support
# - Database backups
# - Production-grade logging

services:
  # PostgreSQL Database with production optimizations
  postgres:
    image: postgres:15-alpine
    container_name: otk-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-otk}
      POSTGRES_USER: ${POSTGRES_USER:-otkreader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-victoria}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
      - ./init-db:/docker-entrypoint-initdb.d:ro
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
    networks:
      - otk-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-otkreader} -d ${POSTGRES_DB:-otk}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=2621kB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=4
      -c max_parallel_workers_per_gather=2
      -c max_parallel_workers=4
      -c max_parallel_maintenance_workers=2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "postgres"

  # Main Application with production settings
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-otk-assistant:latest}
    container_name: otk-assistant-prod
    restart: always
    environment:
      # Database Configuration
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-otk}?ssl=false
      DATASOURCE_USERNAME: ${POSTGRES_USER:-otkreader}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-victoria}
      
      # Application Configuration
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      
      # JVM Configuration for production
      JAVA_OPTS: >-
        -Xmx${APP_MAX_HEAP:-1024m}
        -Xms${APP_MIN_HEAP:-512m}
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:ParallelGCThreads=4
        -XX:ConcGCThreads=2
        -XX:InitiatingHeapOccupancyPercent=45
        -XX:+UseStringDeduplication
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/app/logs/heap-dump.hprof
        -XX:+ExitOnOutOfMemoryError
        -Djava.security.egd=file:/dev/./urandom
        -Dspring.backgroundpreinitializer.ignore=true
      
      # CORS & API Configuration
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://yourdomain.com}
      API_BASE_URL: ${API_BASE_URL:-https://yourdomain.com}
      
      # Logging Configuration
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-WARN}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      
      # Security
      SERVER_SSL_ENABLED: ${SSL_ENABLED:-false}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - otk-backend
      - otk-frontend
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        tag: "app"

  # Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: otk-nginx-prod
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    networks:
      - otk-frontend
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "nginx"

  # Database backup cron job
  backup:
    image: postgres:15-alpine
    container_name: otk-backup-prod
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-otk}
      POSTGRES_USER: ${POSTGRES_USER:-otkreader}
      PGPASSWORD: ${POSTGRES_PASSWORD:-victoria}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - postgres_backups:/backups
      - ./scripts/backup-db.sh:/backup-db.sh:ro
    networks:
      - otk-backend
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "
      echo '0 2 * * * /backup-db.sh' | crontab - &&
      crond -f -l 2
      "
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        tag: "backup"

# Named volumes for persistence
volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local
  app_logs:
    driver: local
  nginx_cache:
    driver: local
  nginx_logs:
    driver: local

# Networks for service isolation
networks:
  otk-backend:
    driver: bridge
    internal: true  # Backend network is internal-only
  otk-frontend:
    driver: bridge  # Frontend network exposed via nginx
